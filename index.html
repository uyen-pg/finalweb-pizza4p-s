<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza 4P's</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#siteFrame{border:0;width:100%;height:100%;display:block}
#loadError{display:none;font-family:Arial,sans-serif;padding:30px;color:#18382e}
</style>
</head>
<body>
<iframe id="siteFrame" src="site.html" title="Pizza 4P's"></iframe>
<div id="loadError">Không tải được website. Hãy tải lại trang.</div>
<script>
(function(){
  const frame=document.getElementById('siteFrame');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      const script=doc.createElement('script');
      script.src='menu-admin-editor.js';
      doc.body.appendChild(script);
    }catch(e){
      document.getElementById('loadError').style.display='block';
    }
  });
})();
</script>
</body>
</html>
